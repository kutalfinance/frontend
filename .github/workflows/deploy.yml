name: Deploy

on:
  push:
    # main → prod (kss-prod-*), staging → staging (kss-staging-*, Sponsorship sub).
    # The GitHub "prod" and "staging" environments hold the per-sub secrets.
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      apply_infra:
        description: "Apply Terraform changes (required to change prod infra)"
        type: boolean
        default: false

env:
  TF_VERSION: "1.10.5"

jobs:
  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'staging' }}
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_CLI: false
      TF_VARS_FILE: ${{ github.ref_name == 'main' && 'prod' || 'staging' }}.tfvars
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          # The wrapper swallows terraform's exit code, breaking -detailed-exitcode
          terraform_wrapper: false
      - name: Terraform Init, Plan, Apply
        working-directory: terraform
        run: |
          WORKSPACE=${{ github.ref_name == 'main' && 'prod' || 'staging' }}
          terraform init
          terraform workspace select $WORKSPACE 2>/dev/null || terraform workspace new $WORKSPACE
          set +e
          terraform plan \
            -detailed-exitcode \
            -var-file=$TF_VARS_FILE \
            -out=tfplan
          PLAN_EXIT=$?
          set -e
          [ $PLAN_EXIT -eq 1 ] && exit 1
          # Prod infra never changes on a plain push — review the plan above, then
          # Actions → Deploy → Run workflow (main) with apply_infra checked.
          if [ $PLAN_EXIT -eq 2 ] && [ "$WORKSPACE" = "prod" ] && [ "${{ inputs.apply_infra }}" != "true" ]; then
            echo "::error::Terraform changes detected for prod; apply is gated. Re-run via workflow_dispatch with apply_infra=true."
            exit 1
          fi
          if [ $PLAN_EXIT -eq 2 ]; then
            terraform apply -auto-approve tfplan
          fi

  deploy:
    name: Deploy to SWA
    runs-on: ubuntu-latest
    needs: terraform
    environment: ${{ github.ref_name == 'main' && 'prod' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          corepack enable
          pnpm install
      - name: Build
        run: pnpm build
        env:
          VITE_API_URL: ${{ github.ref_name == 'main' && 'https://api.kss.kutalfinance.com' || 'https://api-staging.kss.kutalfinance.com' }}
          VITE_ENVIRONMENT: ${{ github.ref_name == 'main' && 'production' || 'development' }}
      - uses: azure/login@v2
        with:
          creds: >
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
            }
      - name: Deploy to SWA
        run: |
          SWA_NAME=${{ github.ref_name == 'main' && 'kss-prod-swa' || 'kss-staging-swa' }}
          RG=${{ github.ref_name == 'main' && 'kss-prod-frontend-rg' || 'kss-staging-frontend-rg' }}
          TOKEN=$(az staticwebapp secrets list --name $SWA_NAME --resource-group $RG --query "properties.apiKey" -o tsv)
          npx --yes @azure/static-web-apps-cli deploy build/client \
            --deployment-token $TOKEN \
            --env production
